# SystaBus ESP32-S3 PIN SCANNER
# Scannt alle GPIO-Pins auf Aktivität zur UART-Diagnose
# Framework: ESP-IDF 6.0.1 | IP: 192.168.180.78

substitutions:
  device_name: "systasolar-pin-scanner"
  device_friendly_name: "SystaSolar Pin Scanner"

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}

esp32:
  board: lolin_s3_mini
  variant: esp32s3
  framework:
    type: esp-idf
    version: "6.0.1"
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_FREERTOS_USE_TICKLESS_IDLE: y

logger:
  level: DEBUG
  baud_rate: 0

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 5min
  manual_ip:
    static_ip: 192.168.180.78
    gateway: 192.168.180.1
    subnet: 255.255.255.0
    dns1: 192.168.180.1
  ap:
    ssid: ${device_friendly_name}-AP
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

# ===== PIN SCANNER: Alle GPIO-Pins (außer Strapping-Pins) =====
binary_sensor:
  # GPIO0 (Strapping) - SKIP
  # GPIO1 (UART0 TX) - kann monitored werden
  - platform: gpio
    name: "GPIO1 Activity"
    id: gpio1_sensor
    pin:
      number: GPIO1
      mode: INPUT
    filters:
      - delayed_on: 5ms
      - delayed_off: 5ms

  # GPIO2 (Strapping) - SKIP
  # GPIO3 (UART0 RX) - kann monitored werden
  - platform: gpio
    name: "GPIO3 Activity"
