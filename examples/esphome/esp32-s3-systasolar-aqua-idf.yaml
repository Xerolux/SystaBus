# SystaBus ESP32-S3 mit ESP-IDF (ohne Arduino)
# Optimiert für Performance und direkte Kontrolle
# Hardware: LOLIN ESP32-S3 Mini mit Hardware-UART

substitutions:
  device_name: "systasolar-aqua-idf"
  device_friendly_name: "SystaSolar Aqua IDF"
  solar_flow_l_min: "2.5"

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}

esp32:
  board: lolin_s3_mini
  variant: esp32s3
  framework:
    type: esp-idf
    version: "6.0.1"
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_FREERTOS_USE_TICKLESS_IDLE: y

logger:
  level: DEBUG
  baud_rate: 0

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 5min
  manual_ip:
    static_ip: 192.168.180.78
    gateway: 192.168.180.1
    subnet: 255.255.255.0
    dns1: 192.168.180.1
  ap:
    ssid: ${device_friendly_name}-AP
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

# Hardware-UART: GPIO13=TX, GPIO11=RX (corrected from GPIO16/17)
uart:
  id: uart_bus
  tx_pin: GPIO13
  rx_pin: GPIO11
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  debug:
    direction: RX
    dummy_receiver: true
    after:
      timeout: 30ms
    sequence:
      - lambda: |-
          static uint32_t parse_errors = 0;
          static uint32_t frame_count = 0;
          static uint32_t total_bytes_received = 0;

          total_bytes_received += bytes.size();

          // Log ALL incoming data for debugging
          if (bytes.size() > 0) {
            std::string hex_str;
            for (uint8_t b : bytes) {
              char buf[4];
              snprintf(buf, sizeof(buf), "%02X ", b);
              hex_str += buf;
            }
            ESP_LOGD("systabus", "RX[%u bytes]: %s | Total: %u bytes",
              bytes.size(), hex_str.c_str(), total_bytes_received);
          }

          auto publish_parse_error = [&]() {
            parse_errors++;
            id(parse_error_counter).publish_state(parse_errors);
          };

          if (bytes.size() < 4) return;

          if (bytes[0] == 0xFC && bytes[1] == 0x24 && bytes.size() < 39) {
            publish_parse_error();
            return;
          }

          auto validate_checksum = [](const std::vector<uint8_t>& frame) -> bool {
            uint8_t sum = 0;
            for (size_t j = 0; j < frame.size() - 1; j++) sum += frame[j];
            return frame.back() == (uint8_t)(0 - sum);
          };

          auto read_i16 = [&](int i) -> int16_t {
            return (int16_t)(((uint16_t) bytes[i] << 8) | bytes[i + 1]);
          };

          auto read_u32 = [&](int i) -> uint32_t {
            return ((uint32_t) bytes[i] << 24) |
                   ((uint32_t) bytes[i + 1] << 16) |
                   ((uint32_t) bytes[i + 2] << 8) |
                   bytes[i + 3];
          };

          auto bcd2dec = [](uint8_t v) -> uint8_t {
            return ((v >> 4) * 10) + (v & 0x0F);
          };

          auto temp_valid = [](float t) -> bool {
            return t > -40.0 && t < 250.0;
          };

          if (!(bytes[0] == 0xFC && bytes[1] == 0x24 && bytes[2] == 0x0B && bytes[3] == 0x01)) return;

          std::vector<uint8_t> frame(bytes.begin(), bytes.begin() + 39);
          if (!validate_checksum(frame)) {
            ESP_LOGW("systabus", "FC24 checksum invalid");
            publish_parse_error();
            return;
          }

          frame_count++;

          // ===== TEMPERATUR-SENSOREN =====
          float tsa = read_i16(4) / 10.0;
          float tse = read_i16(6) / 10.0;
          float twu = read_i16(8) / 10.0;
          float tw2 = read_i16(10) / 10.0;

          // ===== STEUERUNG =====
          uint8_t pso = bytes[12];
          uint8_t ulv = bytes[13];
          uint8_t status_solar = bytes[14];
          uint8_t stoercode = bytes[15];
          uint8_t frostschutz = bytes[16];
          uint8_t ctr = bytes[17];

          // ===== ZEIT (BCD-Dekodierung) =====
          uint8_t stunde = bcd2dec(bytes[18]);
          uint8_t minute = bcd2dec(bytes[19]);
          uint8_t tag = bcd2dec(bytes[20]);
          uint8_t monat = bcd2dec(bytes[21]);

          // ===== UNBEKANNTE BYTES (PHASE 2) =====
          uint16_t byte22_23 = ((uint16_t)bytes[22] << 8) | bytes[23];
          uint8_t byte32_fw = bytes[32];
          uint8_t byte33_variant = bytes[33];
          uint8_t byte34_control = bytes[34];
          uint8_t byte35_diag1 = bytes[35];
          uint8_t byte36_diag2 = bytes[36];
          uint8_t byte37_diag3 = bytes[37];

          // ===== ERTRÄGE =====
          uint32_t tagesenergie = read_u32(24);
          uint32_t gesamtenergie = read_u32(28);

          // ===== SOLARLEISTUNG BERECHNUNG =====
          float delta_t = tsa - tse;
          float solar_leistung = 0.0;
          if (pso > 0 && delta_t > 0.0 && temp_valid(tsa) && temp_valid(tse)) {
            solar_leistung = ${solar_flow_l_min} * delta_t * 69.78;
          }

          // ===== STATUS-TEXTE =====
          std::string status_text;
          switch (status_solar) {
            case 0: status_text = "Maximale Speichertemperatur erreicht"; break;
            case 1: status_text = "Stillstand, Dampf im Kollektor"; break;
            case 2: status_text = "Frostschutzfunktion aktiv"; break;
            case 3: status_text = "Solare Waerme einspeisen"; break;
            case 4: status_text = "Anschiebefunktion aktiv"; break;
            case 5: status_text = "Einschaltverzoegerung"; break;
            case 6: status_text = "Betriebsart Hand/Test/Aus"; break;
            case 7: status_text = "Stoerabschaltung"; break;
            case 8: status_text = "Kollektortemperatur zu niedrig"; break;
            default: { char buf[32]; snprintf(buf, sizeof(buf), "Unbekannt %u", status_solar); status_text = buf; }
          }

          std::string stoer_text;
          switch (stoercode) {
            case 0: stoer_text = "Keine Stoerung"; break;
            default: { char buf[32]; snprintf(buf, sizeof(buf), "Stoercode %u", stoercode); stoer_text = buf; }
          }

          // ===== ZEITSTEMPEL =====
          char zeit_buf[24];
          snprintf(zeit_buf, sizeof(zeit_buf), "%02u:%02u %02u.%02u", stunde, minute, tag, monat);

          char update_buf[40];
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            snprintf(update_buf, sizeof(update_buf), "%04d-%02d-%02d %02d:%02d:%02d",
              now.year, now.month, now.day_of_month, now.hour, now.minute, now.second);
          } else {
            snprintf(update_buf, sizeof(update_buf), "Reglerzeit %s", zeit_buf);
          }

          // ===== STATE CHANGE DETECTION =====
          static float last_tsa = NAN, last_tse = NAN, last_twu = NAN, last_tw2 = NAN, last_power = NAN;
          static uint8_t last_pso = 255, last_ulv = 255, last_status = 255, last_stoer = 255,
                         last_frost = 255, last_ctr = 255, last_byte34 = 255, last_byte35 = 255,
                         last_byte36 = 255, last_byte37 = 255;
          static uint16_t last_byte22_23 = 0xFFFF;
          static uint32_t last_tag = 0xFFFFFFFF, last_gesamt = 0xFFFFFFFF;
          static bool last_solar_active = false;
          static std::string last_zeit = "", last_status_text = "", last_stoer_text = "", last_update = "";

          // ===== TEMPERATURE PUBLISHING =====
          if (temp_valid(tsa) && (isnan(last_tsa) || fabs(tsa - last_tsa) >= 0.1)) {
            id(kollektor_temp_sensor).publish_state(tsa);
            last_tsa = tsa;
          }
          if (temp_valid(tse) && (isnan(last_tse) || fabs(tse - last_tse) >= 0.1)) {
            id(eintritt_temp_sensor).publish_state(tse);
            last_tse = tse;
          }
          if (temp_valid(twu) && (isnan(last_twu) || fabs(twu - last_twu) >= 0.1)) {
            id(speicher_unten_sensor).publish_state(twu);
            last_twu = twu;
          }
          if (tw2 > -20.0 && tw2 < 160.0 && (isnan(last_tw2) || fabs(tw2 - last_tw2) >= 0.1)) {
            id(speicher_2_sensor).publish_state(tw2);
            last_tw2 = tw2;
          }

          // ===== POWER & CONTROL =====
          if (isnan(last_power) || fabs(solar_leistung - last_power) >= 10.0) {
            id(solar_leistung_sensor).publish_state(solar_leistung);
            last_power = solar_leistung;
          }
          if (pso != last_pso) { id(solarpumpe_sensor).publish_state(pso); last_pso = pso; }
          if (ulv != last_ulv) { id(umlenkventil_sensor).publish_state(ulv); last_ulv = ulv; }
          if (status_solar != last_status) { id(status_solar_sensor).publish_state(status_solar); last_status = status_solar; }
          if (stoercode != last_stoer) { id(stoercode_sensor).publish_state(stoercode); last_stoer = stoercode; }
          if (frostschutz != last_frost) { id(frostschutz_sensor).publish_state(frostschutz); last_frost = frostschutz; }
          if (ctr != last_ctr) { id(ctr_sensor).publish_state(ctr); last_ctr = ctr; }

          // ===== ENERGY =====
          if (tagesenergie != last_tag) { id(tagesertrag_sensor).publish_state(tagesenergie); last_tag = tagesenergie; }
          if (gesamtenergie != last_gesamt) { id(gesamtertrag_sensor).publish_state(gesamtenergie); last_gesamt = gesamtenergie; }

          // ===== UNKNOWN BYTES (PHASE 2) =====
          if (byte22_23 != last_byte22_23) { id(byte22_23_sensor).publish_state(byte22_23); last_byte22_23 = byte22_23; }
          if (byte34_control != last_byte34) { id(byte34_control_sensor).publish_state(byte34_control); last_byte34 = byte34_control; }
          if (byte35_diag1 != last_byte35) { id(byte35_diag1_sensor).publish_state(byte35_diag1); last_byte35 = byte35_diag1; }
          if (byte36_diag2 != last_byte36) { id(byte36_diag2_sensor).publish_state(byte36_diag2); last_byte36 = byte36_diag2; }
          if (byte37_diag3 != last_byte37) { id(byte37_diag3_sensor).publish_state(byte37_diag3); last_byte37 = byte37_diag3; }

          // ===== TEXT PUBLISHING =====
          bool solar_active = (status_solar == 3 && pso > 0);
          if (solar_active != last_solar_active) { id(solar_aktiv_sensor).publish_state(solar_active); last_solar_active = solar_active; }
          if (status_text != last_status_text) { id(status_text_sensor).publish_state(status_text); last_status_text = status_text; }
          if (stoer_text != last_stoer_text) { id(stoer_text_sensor).publish_state(stoer_text); last_stoer_text = stoer_text; }
          if (std::string(zeit_buf) != last_zeit) { id(regler_zeit_sensor).publish_state(zeit_buf); last_zeit = zeit_buf; }
          if (std::string(update_buf) != last_update) { id(last_update_sensor).publish_state(update_buf); last_update = update_buf; }

          char display_buf[80];
          snprintf(display_buf, sizeof(display_buf), "%s | PSO:%u%% ULV:%u | TSA:%.1f°C TSE:%.1f°C",
            status_text.c_str(), pso, ulv, tsa, tse);
          id(display_text_sensor).publish_state(display_buf);

          // ===== LOGGING EVERY 60 FRAMES =====
          if (frame_count % 60 == 0) {
            ESP_LOGI("systabus", "Frames=%u Errors=%u Status=%u PSO=%u TSA=%.1f Byte22-23=0x%04X Bytes34-37=%02X%02X%02X%02X",
              frame_count, parse_errors, status_solar, pso, tsa, byte22_23,
              byte34_control, byte35_diag1, byte36_diag2, byte37_diag3);
          }

sensor:
  # ===== TEMPERATUREN =====
  - platform: template
    name: "Kollektor Temp"
    id: kollektor_temp_sensor
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

  - platform: template
    name: "Eintritt Temp"
    id: eintritt_temp_sensor
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

  - platform: template
    name: "Speicher Unten"
    id: speicher_unten_sensor
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

  - platform: template
    name: "Speicher 2 Temp"
    id: speicher_2_sensor
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

  # ===== LEISTUNG & STEUERUNG =====
  - platform: template
    name: "Solar Leistung"
    id: solar_leistung_sensor
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement

  - platform: template
    name: "Solarpumpe PSO"
    id: solarpumpe_sensor
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement

  - platform: template
    name: "Umlenkventil ULV"
    id: umlenkventil_sensor
    accuracy_decimals: 0

  - platform: template
    name: "Status Solar Code"
    id: status_solar_sensor
    accuracy_decimals: 0

  - platform: template
    name: "Stoercode Solar"
    id: stoercode_sensor
    accuracy_decimals: 0

  - platform: template
    name: "Frostschutz"
    id: frostschutz_sensor
    accuracy_decimals: 0

  - platform: template
    name: "Ctr"
    id: ctr_sensor
    accuracy_decimals: 0

  # ===== ERTRÄGE =====
  - platform: template
    name: "Tagesertrag"
    id: tagesertrag_sensor
    unit_of_measurement: "kWh"
    accuracy_decimals: 0
    device_class: energy
    state_class: total_increasing

  - platform: template
    name: "Gesamtertrag"
    id: gesamtertrag_sensor
    unit_of_measurement: "kWh"
    accuracy_decimals: 0
    device_class: energy
    state_class: total

  # ===== UNBEKANNTE BYTES (PHASE 2) =====
  - platform: template
    name: "Byte22-23"
    id: byte22_23_sensor
    accuracy_decimals: 0
    icon: "mdi:counter"

  - platform: template
    name: "Byte34 Control"
    id: byte34_control_sensor
    accuracy_decimals: 0
    icon: "mdi:toggle-multiple"

  - platform: template
    name: "Byte35 Diag 1"
    id: byte35_diag1_sensor
    accuracy_decimals: 0
    icon: "mdi:hospital-box"

  - platform: template
    name: "Byte36 Diag 2"
    id: byte36_diag2_sensor
    accuracy_decimals: 0
    icon: "mdi:hospital-box"

  - platform: template
    name: "Byte37 Diag 3"
    id: byte37_diag3_sensor
    accuracy_decimals: 0
    icon: "mdi:hospital-box"

  # ===== MONITORING =====
  - platform: template
    name: "SystaBus Parse Errors"
    id: parse_error_counter
    accuracy_decimals: 0
    icon: "mdi:alert-circle-outline"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 300s
    unit_of_measurement: "dBm"

binary_sensor:
  - platform: template
    name: "Solar Aktiv"
    id: solar_aktiv_sensor
    device_class: running

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Adresse"
    ssid:
      name: "WLAN"

  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true

  - platform: template
    name: "Status Solar"
    id: status_text_sensor

  - platform: template
    name: "Stoerung Solar Text"
    id: stoer_text_sensor

  - platform: template
    name: "Regler Zeit"
    id: regler_zeit_sensor

  - platform: template
    name: "Last Successful Update"
    id: last_update_sensor

  - platform: template
    name: "Display Text"
    id: display_text_sensor

button:
  - platform: restart
    name: "Neustart"

  - platform: template
    name: "Solar Auto setzen"
    icon: "mdi:white-balance-sunny"
    on_press:
      - uart.write:
          id: uart_bus
          data: [0x0A,0x53,0x1D,0x0B,0x11,0x53,0x45,0x54,0x00,0x01,0x00,0x00,0x00,0x00,0x0F,0x5B,0x46,0x40,0x00,0x36,0xB0,0xA0,0x00,0x03,0x02,0xA0,0x02,0x62,0x00,0x02,0xBC,0x01,0xF4,0x00,0x32,0x00,0x32,0x00,0x30,0x0B,0x00,0x00,0x00,0x00,0x00,0x00,0x08,0x2D,0x0D,0x81,0x00,0x00,0x00,0x01,0x00,0x00,0x00,0x00,0x00,0x00,0x07,0xC1,0xC1,0x00,0x00,0x02,0x00,0x00,0x00,0x00,0x00,0x16,0x00,0x10,0x20,0x06,0x37,0x0F,0x00,0x00,0xCB]

  - platform: template
    name: "Solar Aus setzen"
    icon: "mdi:power"
    on_press:
      - uart.write:
          id: uart_bus
          data: [0x0A,0x53,0x1D,0x0B,0x11,0x53,0x45,0x54,0x01,0x01,0x00,0x00,0x00,0x00,0x0F,0x5B,0x46,0x40,0x00,0x36,0xB0,0xA0,0x00,0x03,0x02,0xA0,0x02,0x62,0x00,0x02,0xBC,0x01,0xF4,0x00,0x32,0x00,0x32,0x00,0x30,0x0B,0x00,0x00,0x00,0x00,0x00,0x00,0x08,0x2D,0x0D,0x81,0x00,0x00,0x00,0x01,0x00,0x00,0x00,0x00,0x00,0x00,0x07,0xC1,0xC1,0x00,0x00,0x02,0x00,0x00,0x00,0x00,0x00,0x16,0x00,0x10,0x20,0x06,0x37,0x0F,0x00,0x00,0xCA]

  - platform: template
    name: "Solar Hand setzen"
    icon: "mdi:hand-back-right"
    on_press:
      - uart.write:
          id: uart_bus
          data: [0x0A,0x53,0x1D,0x0B,0x11,0x53,0x45,0x54,0x03,0x01,0x00,0x00,0x00,0x00,0x0F,0x5B,0x46,0x40,0x00,0x36,0xB0,0xA0,0x00,0x03,0x02,0xA0,0x02,0x62,0x00,0x02,0xBC,0x01,0xF4,0x00,0x32,0x00,0x32,0x00,0x30,0x0B,0x00,0x00,0x00,0x00,0x00,0x00,0x08,0x2D,0x0D,0x81,0x00,0x00,0x00,0x01,0x00,0x00,0x00,0x00,0x00,0x00,0x07,0xC1,0xC1,0x00,0x00,0x02,0x00,0x00,0x00,0x00,0x00,0x16,0x00,0x10,0x20,0x06,0x37,0x0F,0x00,0x00,0xC8]
